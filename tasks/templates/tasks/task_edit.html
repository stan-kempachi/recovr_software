{% extends "core/base.html" %}
{% block title %}Modifier la tâche{% endblock %}

{% block content %}
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow mt-8">
        <h1 class="text-2xl font-bold text-blue-700 mb-6">✏️ Modifier la tâche</h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700">Titre *</label>
                <input type="text" name="title" value="{{ task.title }}" required
                       class="w-full border-gray-300 rounded-md p-2 mt-1 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Description</label>
                <textarea name="description" rows="4"
                          class="w-full border-gray-300 rounded-md p-2 mt-1 focus:ring-blue-500 focus:border-blue-500">{{ task.description }}</textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Date d'échéance</label>
                    <input type="date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}"
                           class="w-full border-gray-300 rounded-md p-2 mt-1 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Priorité</label>
                    <select name="priority" class="w-full border-gray-300 rounded-md p-2 mt-1 focus:ring-blue-500 focus:border-blue-500">
                        <option value="1" {% if task.priority == 1 %}selected{% endif %}>Très haute</option>
                        <option value="2" {% if task.priority == 2 %}selected{% endif %}>Haute</option>
                        <option value="3" {% if task.priority == 3 %}selected{% endif %}>Normale</option>
                        <option value="4" {% if task.priority == 4 %}selected{% endif %}>Basse</option>
                        <option value="5" {% if task.priority == 5 %}selected{% endif %}>Très basse</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Catégorie</label>
                    <select name="category" class="w-full border-gray-300 rounded-md p-2 mt-1">
                        <option value="">—</option>
                        {% for c in categories %}
                            <option value="{{ c.id }}" {% if task.category and c.id == task.category.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Client</label>
                    <select name="client" class="w-full border-gray-300 rounded-md p-2 mt-1">
                        <option value="">—</option>
                        {% for client in clients %}
                            <option value="{{ client.id }}" {% if task.client and client.id == task.client.id %}selected{% endif %}>{{ client.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Nouveau champ: Facture associée -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Facture associée</label>
                <select name="invoice" class="w-full border-gray-300 rounded-md p-2 mt-1">
                    <option value="">—</option>
                    {% for invoice in invoices %}
                        <option value="{{ invoice.id }}" {% if task.invoice and invoice.id == task.invoice.id %}selected{% endif %}>
                            {{ invoice.invoice_number }} - {{ invoice.client.name }} - {{ invoice.amount_ttc }} €
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Nouveau champ: Type de tâche -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Type de tâche</label>
                <select name="task_type" class="w-full border-gray-300 rounded-md p-2 mt-1">
                    <option value="compliance_check" {% if task.task_type == "compliance_check" %}selected{% endif %}>Vérification de conformité</option>
                    <option value="document_missing" {% if task.task_type == "document_missing" %}selected{% endif %}>Document manquant</option>
                    <option value="payment_overdue" {% if task.task_type == "payment_overdue" %}selected{% endif %}>Retard de paiement</option>
                    <option value="platform_sync" {% if task.task_type == "platform_sync" %}selected{% endif %}>Synchronisation plateforme</option>
                    <option value="invoice_rejected" {% if task.task_type == "invoice_rejected" %}selected{% endif %}>Facture rejetée</option>
                    <option value="client_followup" {% if task.task_type == "client_followup" %}selected{% endif %}>Suivi client</option>
                    <option value="manual" {% if task.task_type == "manual" %}selected{% endif %}>Tâche manuelle</option>
                    <option value="other" {% if task.task_type == "other" %}selected{% endif %}>Autre</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Nouveau champ: Date de rappel -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Date de rappel</label>
                    <input type="date" name="reminder_date" value="{{ task.reminder_date|date:'Y-m-d' }}"
                           class="w-full border-gray-300 rounded-md p-2 mt-1 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <!-- Nouveau champ: Statut -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Statut</label>
                    <select name="status" class="w-full border-gray-300 rounded-md p-2 mt-1">
                        <option value="pending" {% if task.status == "pending" %}selected{% endif %}>En attente</option>
                        <option value="in_progress" {% if task.status == "in_progress" %}selected{% endif %}>En cours</option>
                        <option value="completed" {% if task.status == "completed" %}selected{% endif %}>Terminée</option>
                        <option value="cancelled" {% if task.status == "cancelled" %}selected{% endif %}>Annulée</option>
                        <option value="blocked" {% if task.status == "blocked" %}selected{% endif %}>Bloquée</option>
                    </select>
                </div>
            </div>

            <!-- Nouveau champ: Tâche récurrente -->
            <div class="flex items-center mt-2">
                <input type="checkbox" id="is_recurring" name="is_recurring" {% if task.is_recurring %}checked{% endif %}
                       class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                <label for="is_recurring" class="ml-2 block text-sm text-gray-700">Tâche récurrente</label>
            </div>

            <!-- Section de récurrence conditionnelle -->
            <div id="recurrence_section" class="border p-4 rounded-md mt-2 bg-gray-50" {% if not task.is_recurring %}style="display: none;"{% endif %}>
                <h3 class="font-medium mb-2">Configuration de la récurrence</h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fréquence</label>
                        <select name="recurrence_frequency" class="w-full border-gray-300 rounded-md p-2 mt-1">
                            <option value="daily" {% if task.recurrence_rule.frequency == "daily" %}selected{% endif %}>Quotidienne</option>
                            <option value="weekly" {% if task.recurrence_rule.frequency == "weekly" %}selected{% endif %}>Hebdomadaire</option>
                            <option value="monthly" {% if task.recurrence_rule.frequency == "monthly" %}selected{% endif %}>Mensuelle</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Intervalle</label>
                        <input type="number" name="recurrence_interval" value="{{ task.recurrence_rule.interval|default:1 }}" min="1"
                               class="w-full border-gray-300 rounded-md p-2 mt-1 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Assigner à</label>
                <select name="assigned_to" class="w-full border-gray-300 rounded-md p-2 mt-1">
                    <option value="">—</option>
                    {% for u in users %}
                        <option value="{{ u.id }}" {% if task.assigned_to and u.id == task.assigned_to.id %}selected{% endif %}>{{ u.email }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex justify-end space-x-2 pt-4">
                <a href="{% url 'tasks:task_list' %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300">Annuler</a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                    Enregistrer
                </button>
            </div>
        </form>
    </div>

    <!-- Script pour gérer l'affichage de la section de récurrence -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const isRecurringCheckbox = document.getElementById('is_recurring');
            const recurrenceSection = document.getElementById('recurrence_section');

            isRecurringCheckbox.addEventListener('change', function() {
                if (this.checked) {
                    recurrenceSection.style.display = 'block';
                } else {
                    recurrenceSection.style.display = 'none';
                }
            });
        });
    </script>
{% endblock %}
