version: '3.8'

services:
  nginx:
    container_name: recovr_nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - recovr_network
    volumes:
      - /home/django/recovr_software/nginx/conf.d:/etc/nginx/conf.d:ro
      - /home/django/recovr_software/nginx/html:/usr/share/nginx/html
      - /home/django/recovr_software/production/nginx/html:/var/www/html
      - static_production:/var/www/production/static:ro
      - static_staging:/var/www/staging/static:ro
      - media_production:/var/www/production/media:ro
      - media_staging:/var/www/staging/media:ro
      - ./logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  recovr_network:
    external: true

volumes:
  static_production:
    external: true
  static_staging:
    external: true
  media_production:
    external: true
  media_staging:
    external: true
