version: '3.8'

services:
  nginx:
    container_name: recovr_nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "8080:8080"  # Port dédié staging
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - static_production:/var/www/production/static:ro
      - static_staging:/var/www/staging/static:ro
      - media_production:/var/www/production/media:ro
      - media_staging:/var/www/staging/media:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - recovr_network
    restart: unless-stopped
    depends_on:
      web_production:
        condition: service_healthy
      web_staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  recovr_network:
    external: true

volumes:
  static_production:
    external: true
  static_staging:
    external: true
  media_production:
    external: true
  media_staging:
    external: true
