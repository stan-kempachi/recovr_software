# ==========================
# Upstreams
# ==========================
upstream django_production {
    server recovr_web_production:8000 max_fails=3 fail_timeout=30s;
}

upstream django_staging {
    server recovr_web_staging:8001 max_fails=3 fail_timeout=30s;
}

# ==========================
# Logs
# ==========================
log_format main_json escape=json '{
    "time": "$time_local",
    "remote_addr": "$remote_addr",
    "remote_user": "$remote_user",
    "request": "$request",
    "status": $status,
    "body_bytes_sent": $body_bytes_sent,
    "request_time": $request_time,
    "upstream_response_time": "$upstream_response_time",
    "upstream_addr": "$upstream_addr",
    "http_referrer": "$http_referer",
    "http_user_agent": "$http_user_agent",
    "http_x_forwarded_for": "$http_x_forwarded_for"
}';

# ==========================
# Serveur HTTP (port 80) - Redirection vers HTTPS
# ==========================
server {
    listen 80 default_server;
    server_name maeshan.com www.maeshan.com;

    access_log /var/log/nginx/redirect_access.log main_json;
    error_log /var/log/nginx/redirect_error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location /nginx-health {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================
# Serveur HTTPS (port 443)
# ==========================
server {
    listen 443 ssl http2 default_server;
    server_name maeshan.com www.maeshan.com;

    ssl_certificate /etc/letsencrypt/live/maeshan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maeshan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/production_access.log main_json;
    error_log /var/log/nginx/production_error.log warn;

    server_tokens off;
    client_max_body_size 50M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # ---- Healthcheck Nginx ----
    location /nginx-health {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }

    # ---- Healthcheck Django (prod) ----
    location /health/ {
        proxy_pass http://django_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- Static production ----
    location /static/ {
        alias /var/www/production/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ =404;
    }

    # ---- Media production ----
    location /media/ {
        alias /var/www/production/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ =404;
    }

    # ---- Staging via /staging ----
    location /staging/ {
        proxy_pass http://django_staging/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Script-Name /staging;
        proxy_set_header X-Forwarded-Prefix /staging;
    }

    # ---- Healthcheck staging ----
    location /staging/health/ {
        proxy_pass http://django_staging/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- Static staging ----
    location ^~ /staging/static/ {
        alias /var/www/staging/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ =404;
    }

    # ---- Media staging ----
    location ^~ /staging/media/ {
        alias /var/www/staging/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ =404;
    }

    # ---- Django Production par défaut ----
    location / {
        proxy_pass http://django_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==========================
# Serveur Staging direct (port 8080) - Sans SSL
# ==========================
server {
    listen 8080;
    server_name maeshan.com www.maeshan.com;

    access_log /var/log/nginx/staging_direct_access.log main_json;
    error_log /var/log/nginx/staging_direct_error.log warn;

    server_tokens off;
    client_max_body_size 50M;

    location /nginx-health {
        access_log off;
        return 200 "staging nginx healthy\n";
        add_header Content-Type text/plain;
    }

    location /health/ {
        proxy_pass http://django_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        access_log off;
    }

    location /static/ {
        alias /var/www/staging/static/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    location /media/ {
        alias /var/www/staging/media/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://django_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
