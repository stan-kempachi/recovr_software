# Serveur pour l'environnement de production
server {
    listen 80;
    server_name recovr.example.com www.recovr.example.com;

    # Redirection vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Configuration pour Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name recovr.example.com www.recovr.example.com;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/recovr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recovr.example.com/privkey.pem;

    # Paramètres SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Fichiers statiques
    location /static/ {
        alias /recovr_software/production/static/;
    }

    location /media/ {
        alias /recovr_software/production/media/;
    }

    # Proxy vers l'application Django
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Serveur pour l'environnement de staging
server {
    listen 80;
    server_name recovr-staging.example.com;

    # Redirection vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Configuration pour Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name recovr-staging.example.com;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/recovr-staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recovr-staging.example.com/privkey.pem;

    # Paramètres SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Protection par mot de passe pour l'environnement staging
    auth_basic "Environnement de Staging";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

    # Fichiers statiques
    location /static/ {
        alias /recovr_software/staging/static/;
    }

    location /media/ {
        alias /recovr_software/staging/media/;
    }

    # Proxy vers l'application Django de staging
    location / {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}