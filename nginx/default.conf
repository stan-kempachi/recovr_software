# ==========================
# Upstreams
# ==========================
upstream django_production {
    server web_production:8000 max_fails=3 fail_timeout=30s;
}

upstream django_staging {
    server web_staging:8001 max_fails=3 fail_timeout=30s;
}

# ==========================
# Logs
# ==========================
log_format main_json escape=json '{
    "time": "$time_local",
    "remote_addr": "$remote_addr",
    "remote_user": "$remote_user",
    "request": "$request",
    "status": $status,
    "body_bytes_sent": $body_bytes_sent,
    "request_time": $request_time,
    "upstream_response_time": "$upstream_response_time",
    "upstream_addr": "$upstream_addr",
    "http_referrer": "$http_referer",
    "http_user_agent": "$http_user_agent",
    "http_x_forwarded_for": "$http_x_forwarded_for"
}';

# ==========================
# Serveur Production (port 80)
# ==========================
server {
    listen 80 default_server;
    server_name _;

    # Logs
    access_log /var/log/nginx/production_access.log main_json;
    error_log /var/log/nginx/production_error.log warn;

    # Sécurité / taille max upload
    server_tokens off;
    client_max_body_size 50M;

    # Timeouts proxy
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ---- Healthcheck Nginx ----
    location /nginx-health {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }

    # ---- Healthcheck Django (prod) ----
    location /health/ {
        proxy_pass http://django_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- Static prod ----
    location /static/ {
        alias /var/www/production/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ =404;
    }

    # ---- Media prod ----
    location /media/ {
        alias /var/www/production/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ =404;
    }

    # ---- Staging via /staging ----
    location ^~ /staging/ {
        rewrite ^/staging/(.*)$ /$1 break;
        proxy_pass http://django_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /staging;
    }

    # ---- Static staging ----
    location ^~ /staging/static/ {
        alias /var/www/staging/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ =404;
    }

    # ---- Media staging ----
    location ^~ /staging/media/ {
        alias /var/www/staging/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ =404;
    }

    # ---- Django Production par défaut ----
    location / {
        proxy_pass http://django_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # ---- Page d'erreur ----
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ---- Sécurité fichiers cachés ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==========================
# Serveur Staging direct (port 8080)
# ==========================
server {
    listen 8080;
    server_name _;

    # Logs
    access_log /var/log/nginx/staging_direct_access.log main_json;
    error_log /var/log/nginx/staging_direct_error.log warn;

    server_tokens off;
    client_max_body_size 50M;

    # ---- Healthcheck ----
    location /nginx-health {
        access_log off;
        return 200 "staging nginx healthy\n";
        add_header Content-Type text/plain;
    }

    location /health/ {
        proxy_pass http://django_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- Static ----
    location /static/ {
        alias /var/www/staging/static/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    location /media/ {
        alias /var/www/staging/media/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    # ---- Django staging ----
    location / {
        proxy_pass http://django_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
