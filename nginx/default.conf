# Serveur pour l'environnement de production
server {
    listen 80;
    server_name recovr.com www.recovr.com;
    
    # Redirection vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Configuration pour Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name recovr.com www.recovr.com;
    
    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/recovr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recovr.com/privkey.pem;
    
    # Paramètres SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # Fichiers statiques
    location /static/ {
        alias /var/www/production/static/;
    }
    
    location /media/ {
        alias /var/www/production/media/;
    }
    
    # Proxy vers l'application Django
    location / {
        proxy_pass http://web_production:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Serveur pour l'environnement de staging
server {
    listen 80;
    server_name staging.recovr.com;
    
    # Redirection vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
    
    # Configuration pour Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name staging.recovr.com;
    
    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/staging.recovr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.recovr.com/privkey.pem;
    
    # Paramètres SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # Protection par mot de passe pour l'environnement staging
    auth_basic "Environnement de Staging";
    auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
    
    # Fichiers statiques
    location /static/ {
        alias /var/www/staging/static/;
    }
    
    location /media/ {
        alias /var/www/staging/media/;
    }
    
    # Proxy vers l'application Django de staging
    location / {
        proxy_pass http://web_staging:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}