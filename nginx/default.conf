# Format de log amélioré
log_format main_json escape=json '{ "time": "$time_local", '
                          '"remote_addr": "$remote_addr", '
                          '"remote_user": "$remote_user", '
                          '"request": "$request", '
                          '"status": $status, '
                          '"body_bytes_sent": $body_bytes_sent, '
                          '"request_time": $request_time, '
                          '"http_referrer": "$http_referer", '
                          '"http_user_agent": "$http_user_agent" }';

# Production
server {
   listen 80;
   server_name recovr.com www.recovr.com;

   # Utilisation du nouveau format de log
   access_log /var/log/nginx/access.log main_json;
   error_log /var/log/nginx/error.log warn;

   # Configuration des timeouts
   proxy_connect_timeout 300s;
   proxy_send_timeout 300s;
   proxy_read_timeout 300s;

   # Health check
   location /nginx-health {
       access_log off;
       return 200 "healthy\n";
   }

   location /static/ {
       alias /var/www/production/static/;
       expires 30d;
       add_header Cache-Control "public, max-age=2592000";
   }

   location /media/ {
       alias /var/www/production/media/;
       expires 30d;
       add_header Cache-Control "public, max-age=2592000";
   }

   location / {
       proxy_pass http://web_production:8000;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;

       # Ajouter un timeout plus long
       proxy_read_timeout 300;

       # Gestion des erreurs
       proxy_intercept_errors on;
       error_page 502 503 504 /50x.html;
   }

   # Page d'erreur personnalisée
   location = /50x.html {
       root /usr/share/nginx/html;
   }
}

# Configuration pour le serveur staging
server {
   listen 80;
   server_name staging.recovr.com;

   # Utilisation du nouveau format de log
   access_log /var/log/nginx/staging_access.log main_json;
   error_log /var/log/nginx/staging_error.log warn;

   # Configuration des timeouts
   proxy_connect_timeout 300s;
   proxy_send_timeout 300s;
   proxy_read_timeout 300s;

   # Health check
   location /nginx-health {
       access_log off;
       return 200 "healthy\n";
   }

   # Fichiers statiques
   location /static/ {
       alias /var/www/staging/static/;
       expires 7d;
       add_header Cache-Control "public, max-age=604800";
   }

   location /media/ {
       alias /var/www/staging/media/;
       expires 7d;
       add_header Cache-Control "public, max-age=604800";
   }

   # Proxy vers l'application Django
   location / {
       proxy_pass http://web_staging:8001;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;

       # Ajouter un timeout plus long
       proxy_read_timeout 300;

       # Gestion des erreurs
       proxy_intercept_errors on;
       error_page 502 503 504 /50x.html;
   }

   # Page d'erreur personnalisée
   location = /50x.html {
       root /usr/share/nginx/html;
   }
}

# Redirect par défaut - optionnel
server {
   listen 80 default_server;
   return 301 https://recovr.com$request_uri;
}