# Configuration globale upstream pour une meilleure performance
upstream django_production {
    server web_production:8000 max_fails=3 fail_timeout=30s;
}

upstream django_staging {
    server web_staging:8001 max_fails=3 fail_timeout=30s;
}

# Format de log amélioré avec plus d'informations de debugging
log_format main_json escape=json '{
    "time": "$time_local",
    "remote_addr": "$remote_addr",
    "remote_user": "$remote_user",
    "request": "$request",
    "status": $status,
    "body_bytes_sent": $body_bytes_sent,
    "request_time": $request_time,
    "upstream_response_time": "$upstream_response_time",
    "upstream_addr": "$upstream_addr",
    "http_referrer": "$http_referer",
    "http_user_agent": "$http_user_agent",
    "http_x_forwarded_for": "$http_x_forwarded_for"
}';

# Serveur principal (IP + production)
server {
    listen 80 default_server;
    server_name _;

    # Logs
    access_log /var/log/nginx/production_access.log main_json;
    error_log /var/log/nginx/production_error.log warn;

    # Sécurité de base
    server_tokens off;
    client_max_body_size 50M;

    # Configuration des timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Health check pour Nginx
    location /nginx-health {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }

    # Health check pour Django (production)
    location /health/ {
        proxy_pass http://django_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Fichiers statiques production
    location /static/ {
        alias /var/www/production/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";

        # Gestion des erreurs pour les fichiers manquants
        try_files $uri $uri/ =404;
    }

    # Fichiers media production
    location /media/ {
        alias /var/www/production/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";

        try_files $uri $uri/ =404;
    }

    # Accès au staging via /staging/
    location ^~ /staging/ {
        rewrite ^/staging/(.*)$ /$1 break;
        proxy_pass http://django_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /staging;

        # Headers pour Django
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
    }

    # Fichiers statiques staging via /staging/static/
    location ^~ /staging/static/ {
        rewrite ^/staging/static/(.*)$ /static/$1 break;
        alias /var/www/staging/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ =404;
    }

    # Fichiers media staging via /staging/media/
    location ^~ /staging/media/ {
        rewrite ^/staging/media/(.*)$ /media/$1 break;
        alias /var/www/staging/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri $uri/ =404;
    }

    # Application Django production (par défaut)
    location / {
        proxy_pass http://django_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headers additionnels pour Django
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;

        # Gestion des erreurs
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;

        # WebSocket support (si nécessaire plus tard)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Page d'erreur personnalisée
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Serveur dédié staging (optionnel, pour tests directs)
server {
    listen 8080;
    server_name _;

    # Logs séparés pour staging
    access_log /var/log/nginx/staging_direct_access.log main_json;
    error_log /var/log/nginx/staging_direct_error.log warn;

    # Sécurité
    server_tokens off;
    client_max_body_size 50M;

    # Health check
    location /nginx-health {
        access_log off;
        return 200 "staging nginx healthy\n";
        add_header Content-Type text/plain;
    }

    # Health check Django staging
    location /health/ {
        proxy_pass http://django_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Fichiers statiques staging
    location /static/ {
        alias /var/www/staging/static/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    location /media/ {
        alias /var/www/staging/media/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    # Application Django staging
    location / {
        proxy_pass http://django_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}