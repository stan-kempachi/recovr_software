version: '3.8'

services:
  web_staging:
    container_name: recovr_web_staging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=staging
    env_file:
      - .env
    command: >
      bash -c "python manage.py migrate --noinput && 
               python manage.py collectstatic --noinput && 
               gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 2 --timeout 120 --reload"
    volumes:
      - static_staging:/app/staticfiles
      - media_staging:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.staging_settings
    ports:
      - "8001:8001"
    networks:
      - recovr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL  http://localhost:8001/health/ || wget --quiet --tries=1 --spider http://localhost:8001/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  recovr_network:
    external: true

volumes:
  static_staging:
    external: true
  media_staging:
    external: true