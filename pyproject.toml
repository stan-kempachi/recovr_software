[tool.poetry]
name = "core"
version = "1.4.0"
description = "Projet généré avec Cookiecutter + Poetry"
authors = ["Stan Bruyere <adm.standev@gmail.com>"]
packages = [{ include = "core", from = "." }]

[tool.poetry.dependencies]
python = "^3.12"
django = "^4.2"
djangorestframework = "^3.16.1"
django-cors-headers = "^4.7.0"
pillow = "^11.3.0"
python-semantic-release = "^10.3.1"
dotenv = "^0.9.9"
psycopg2-binary = "^2.9.10"
gunicorn = "^21.2.0"
django-allauth = "^65.11.2"
pyjwt = "^2.10.1"
cryptography = "^46.0.1"
django-allauth-ui = "^1.8.1"
pypdf2 = "^3.0.1"
openpyxl = "^3.1.5"
whitenoise = "^6.9.0"

[tool.poetry.group.dev.dependencies]
black = "*"
isort = "*"
ruff = "*"
pytest = "*"
pre-commit = "*"
pytest-django = "^4.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Configuration de semantic-release
[tool.semantic_release]
version_variables = ["config/__init__.py:__version__"]
branch = "master"
changelog_file = "CHANGELOG.md"
upload_to_repository = true
major_on_zero = true
tag_format = "v{version}"
commit_parser = "conventional"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "gitlab"
domain = "gitlab.com"
owner = "django1361117"
name = "recovr_software"
protocol = "ssh"
remote_name = "origin"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db -v"


[tool.isort]
profile = "black"
known_first_party = "accounts,invoices,tasks, reporting, notifications,dashboard, core, config, compliance"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
