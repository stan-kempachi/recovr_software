{% with s=invoice.status %}
<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full
    {% if s == 'paid' %}bg-green-100 text-green-800
    {% elif s == 'partially_paid' %}bg-emerald-100 text-emerald-800
    {% elif s == 'accepted' %}bg-blue-100 text-blue-800
    {% elif s == 'submitted' %}bg-indigo-100 text-indigo-800
    {% elif s == 'disputed' %}bg-orange-100 text-orange-800
    {% elif s == 'rejected' %}bg-red-100 text-red-800
    {% else %}bg-gray-100 text-gray-700{% endif %}">
    {{ invoice.get_status_display }}
</span>
{% endwith %}
