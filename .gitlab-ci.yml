# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12-slim"
  tags:
    - self-hosted
  only:
    - master
  variables:
    LOG_LEVEL: INFO
    GIT_DEPTH: 0  # nécessaire pour récupérer tous les commits et tags
  before_script:
    - apt-get update && apt-get install -y git openssh-client jq curl
    - pip install --upgrade pip
    - pip install poetry
    - pip install --upgrade python-semantic-release==10.4.1
    - rm -rf .venv .cache/pypoetry

    # Configuration SSH
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$CHANGELOG_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts

    # Configuration Git
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    - git remote set-url origin "git@gitlab.com:${CI_PROJECT_PATH}.git"
    - git config --global push.followTags true  # Assure que les tags sont pushés automatiquement

    # Synchronisation avec le dépôt distant
    - git fetch --all --tags
    - git checkout master
    - git pull origin master --rebase

    - poetry config virtualenvs.in-project true
    - poetry install --no-cache
  script:
    - |
      echo "=== Affichage des remotes git disponibles ==="
      git remote -v
      
      echo "=== Vérification des derniers commits ==="
      git log -n 5 --pretty=format:"%h - %an, %ar : %s"
      
      echo "=== Vérification des derniers tags ==="
      git tag -l --sort=-v:refname | head -5
      
      echo "=== Utilisation de la configuration dans pyproject.toml ==="
      
      # On utilise l'option --no-push pour vérifier les changements sans pousser
      echo "=== Analyse des commits pour la mise à jour de version ==="
      COMMIT_ANALYSIS=$(poetry run semantic-release version --no-push --verbose)
      RESULT=$?
      echo "$COMMIT_ANALYSIS"
      
      # Si le code de retour est 0, cela signifie qu'une nouvelle version a été créée
      if [ $RESULT -eq 0 ]; then
        echo "=== Nouvelle version créée localement ==="
        
        # Récupérer la nouvelle version depuis __init__.py
        NEW_VERSION=$(grep -oP '__version__ = "\K[^"]+' config/__init__.py || echo "version-inconnue")
        echo "Nouvelle version détectée: ${NEW_VERSION}"
        
        # Vérifier les fichiers modifiés
        git status
        
        # Ajouter tous les fichiers potentiellement modifiés
        git add CHANGELOG.md config/__init__.py README.md package.json || true
        
        # Commit des changements
        git commit -m "chore: update version to ${NEW_VERSION} [skip ci]"
        
        # Vérifier si le tag existe déjà
        if ! git tag | grep -q "v${NEW_VERSION}"; then
          # Création du tag pour la version
          git tag -a "v${NEW_VERSION}" -m "Release version ${NEW_VERSION}"
        fi
        
        # Push des changements et des tags
        git push origin master
        git push origin --tags
        
        echo "✅ Version ${NEW_VERSION} et changelog automatiquement mis à jour et publiés."
      else
        # Réinitialiser les changements locaux si aucune mise à jour n'est nécessaire
        git reset --hard HEAD
        echo "🔄 Aucune mise à jour de version nécessaire selon l'analyse des commits."
      fi

