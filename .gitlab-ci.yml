variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

# Cache global pour Poetry
.poetry_cache: &poetry_cache
  cache:
    key: poetry-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pypoetry
      - .venv/

# Template pour les jobs Python avec runner auto-hébergé
.python_job: &python_job
  image: "python:3.12-slim"
  <<: *poetry_cache
  tags:
    - self-hosted
  before_script:
    - pip install --upgrade pip poetry
    - poetry config virtualenvs.in-project true
    - poetry install

