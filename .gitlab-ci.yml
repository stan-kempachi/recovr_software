stages:
  - lint
  - test
  - changelog
  - sync
#  - deploy


# Lint stage
lint:
  stage: lint
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .


# Test stage
test:
  stage: test
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run pytest


# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12"
  only:
    - master
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    # Configuration SSH
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "$CI_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    # Configurer git pour travailler avec la branche
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    - git checkout -B master
    # Configurer l'URL du dépôt en utilisant SSH au lieu de HTTPS
    - git remote set-url origin git@gitlab.com:django1361117/recovr_software.git
  script:
    # Vérifier si config/__init__.py existe, sinon le créer
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi

    # Créer ou mettre à jour setup.cfg pour utiliser GitLab au lieu de GitHub
    - |
      cat > setup.cfg << EOF
      [semantic_release]
      version_variable = config/__init__.py:__version__
      branch = master
      changelog_file = CHANGELOG.md
      # Configuration pour GitLab
      upload_to_repository = false
      vcs_provider = gitlab
      gitlab_url = https://gitlab.com
      gitlab_token = ${GITLAB_TOKEN}
      EOF

    # Créer pyproject.toml pour semantic-release v10+
    - |
      cat > pyproject.toml << EOF
      [tool.semantic_release]
      version_variables = ["config/__init__.py:__version__"]
      branch = "master"
      changelog_file = "CHANGELOG.md"
      upload_to_repository = false
      
      [tool.semantic_release.remote]
      type = "gitlab"
      repository = "django1361117/recovr_software"
      gitlab_url = "https://gitlab.com"
      token = "${GITLAB_TOKEN}"
      EOF

    # Afficher le dernier commit pour le débogage
    - echo "Dernier message de commit:"
    - git log -1 --pretty=%B

    # Détecter si des changements conséquents ont été faits
    - |
      CHANGES=$(git log -1 --pretty=%B | grep -E "^(feat|fix|perf|revert|BREAKING CHANGE)" || true)
      echo "Changements détectés: $CHANGES"
      
      if [ ! -z "$CHANGES" ]; then
        echo "Changements conséquents détectés, mise à jour du changelog..."
      
        # Exécuter semantic-release avec no-push pour éviter l'erreur de push
        semantic-release version --no-push
      
        # Vérifier si des fichiers ont été modifiés
        if git status --porcelain | grep -q "CHANGELOG.md\|config/__init__.py"; then
          git add CHANGELOG.md config/__init__.py
          git commit -m "docs: mise à jour du changelog [skip ci]"
          git push origin HEAD:master
          echo "Changelog mis à jour et poussé vers le dépôt"
        else
          echo "Aucun changement détecté dans CHANGELOG.md ou config/__init__.py"
        fi
      else
        echo "Pas de changements conséquents, le changelog reste inchangé"
      fi


sync-to-github:
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    # Configuration SSH
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Utiliser la clé SSH spécifique pour GitHub
      echo "$GITHUB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_github
      chmod 600 ~/.ssh/id_rsa_github
      ssh-add ~/.ssh/id_rsa_github
      # Ajouter GitHub aux hôtes connus
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    # Ajouter GitHub comme remote ou mettre à jour s'il existe déjà
    - git remote add github git@github.com:stan-kempachi/recovr_software.git || git remote set-url github git@github.com:stan-kempachi/recovr_software.git
  script:
    # Pousser vers GitHub
    - git push github HEAD:master


