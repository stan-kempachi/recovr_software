stages:
  - lint
  - test
  - changelog
  - sync
#  - deploy


# Lint stage
lint:
  stage: lint
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .


# Test stage
test:
  stage: test
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run pytest


# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12"
  only:
    - master
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    # Configuration SSH
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "$CI_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    # Configurer git pour travailler avec la branche
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    - git checkout -B master
    # Configurer l'URL du dépôt en utilisant SSH au lieu de HTTPS
    - git remote set-url origin git@gitlab.com:django1361117/recovr_software.git
  script:
    # Vérifier si config/__init__.py existe, sinon le créer
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi

    # Mettre à jour le token dans pyproject.toml sans modifier le reste du fichier
    - |
      if [ -f "pyproject.toml" ]; then
        # Sauvegarder le contenu existant
        cp pyproject.toml pyproject.toml.bak
      
        # Vérifier si la section remote existe et mettre à jour uniquement le token
        if grep -q "\[tool.semantic_release.remote\]" pyproject.toml; then
          sed -i "/\[tool.semantic_release.remote\]/,/^\[/ s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml
        else
          # Si la section remote n'existe pas mais que tool.semantic_release existe
          if grep -q "\[tool.semantic_release\]" pyproject.toml; then
            echo -e "\n[tool.semantic_release.remote]\ntype = \"gitlab\"\nrepository = \"django1361117/recovr_software\"\ngitlab_url = \"https://gitlab.com\"\ntoken = \"${GITLAB_TOKEN}\"" >> pyproject.toml
          fi
        fi
      fi

    # Exécuter semantic-release pour mettre à jour le CHANGELOG
    - semantic-release --ci version
    - semantic-release --ci changelog

    # Commit et push des changements
    - |
      if git diff --exit-code; then
        echo "Aucun changement à committer"
      else
        git add CHANGELOG.md config/__init__.py
        git commit -m "chore: Mise à jour du CHANGELOG et de la version [skip ci]"
        git push origin master
      fi
      

sync-to-github:
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Utiliser la clé SSH spécifique pour GitHub
      echo "$GITHUB_SSH_KEY"

