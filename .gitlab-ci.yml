stages:
  - lint
  - test
  - changelog
  - sync
#  - deploy

# Lint stage
lint:
  stage: lint
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .


# Test stage
test:
  stage: test
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run pytest


# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12"
  only:
    - master
  variables:
    GH_TOKEN: $GH_TOKEN
  before_script:
    # Configuration SSH
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "$CI_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    # Configurer git pour travailler avec la branche
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    - git checkout -B master
    # Configurer l'URL du dépôt en utilisant SSH au lieu de HTTPS
    - git remote set-url origin git@gitlab.com:django1361117/recovr_software.git
  script:
    # Vérifier si config/__init__.py existe, sinon le créer
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi

    # Vérifier si setup.cfg existe, sinon le créer
    - |
      if [ ! -f "setup.cfg" ]; then
        echo '[semantic_release]' > setup.cfg
        echo 'version_variable = config/__init__.py:__version__' >> setup.cfg
        echo 'branch = master' >> setup.cfg
        echo 'changelog_file = CHANGELOG.md' >> setup.cfg
        echo 'github_repo = recovr_software' >> setup.cfg
        echo 'github_user = stan-kempachi' >> setup.cfg
      fi


    # Détecter si des changements conséquents ont été faits
    - |
      CHANGES=$(git log -1 --pretty=%B | grep -E "^(feat|fix|perf|revert|BREAKING CHANGE)")
      if [ ! -z "$CHANGES" ]; then
        echo "Changements conséquents détectés, mise à jour du changelog..."
        semantic-release version 
        git config --global user.name "GitLab CI"
        git config --global user.email "gitlab-ci@example.com"
        git add CHANGELOG.md config/__init__.py
        git commit -m "docs: mise à jour du changelog [skip ci]"
        git push origin HEAD:master
      else
        echo "Pas de changements conséquents, le changelog reste inchangé"
      fi


sync-to-github:
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    # Configuration SSH
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "$CI_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
  script:
    # Configuration Git
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"

    # Utilisation de SSH au lieu de HTTPS pour GitHub
    - git remote add github git@github.com:stan-kempachi/recovr_software.git

    # Push vers GitHub avec la branche master
    - git push github HEAD:master
    - git push github --tags  # Pour synchroniser aussi les tags


