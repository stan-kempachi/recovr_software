stages:
  - lint
  - test
  - changelog
  - sync
  - deploy-staging
  - deploy-production


# Lint stage
lint:
  stage: lint
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .


# Test stage
test:
  stage: test
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run pytest


# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12"
  only:
    - master
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    # Configuration SSH
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "$CI_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    # Configurer git pour travailler avec la branche
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    # Au lieu de faire un checkout, cloner le repo avec l'historique complet
    - git clone --depth=50 git@gitlab.com:${CI_PROJECT_PATH}.git /tmp/repo
    - cd /tmp/repo
    # Configurer l'URL du dépôt en utilisant SSH au lieu de HTTPS
    - git remote set-url origin git@gitlab.com:django1361117/recovr_software.git
  script:
    # Vérifier si config/__init__.py existe, sinon le créer
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi

    # Mettre à jour le token dans pyproject.toml
    - |
      if grep -q "\[tool.semantic_release.remote\]" pyproject.toml; then
        sed -i "/\[tool.semantic_release.remote\]/,/^\[/ s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml || true
        # Si le token est la dernière ligne du fichier
        sed -i "s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml || true
      fi

    # Afficher le dernier commit pour le débogage
    - echo "Dernier message de commit:"
    - git log -1 --pretty=%B

    # Utiliser semantic-release directement sans détection supplémentaire
    - semantic-release version --no-push

    # Vérifier si des fichiers ont été modifiés
    - |
      if git status --porcelain | grep -q "CHANGELOG.md\|config/__init__.py"; then
        git add CHANGELOG.md config/__init__.py
        git commit -m "docs: mise à jour du changelog [skip ci]"
        git push origin HEAD:master
        echo "Changelog mis à jour et poussé vers le dépôt"
      else
        echo "Aucun changement détecté dans CHANGELOG.md ou config/__init__.py"
      fi   


sync-to-github:
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Utiliser la clé SSH spécifique pour GitHub
      echo "$GITHUB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_github
      chmod 600 ~/.ssh/id_rsa_github
      ssh-add ~/.ssh/id_rsa_github
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    # Configurer git pour travailler avec GitHub
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
  script:
    # Cloner le dépôt GitLab actuel
    - git clone --mirror $CI_REPOSITORY_URL gitlab_repo
    - cd gitlab_repo
    # Configurer le dépôt GitHub distant
    - git remote add github git@github.com:stan-kempachi/recovr_software.git
    # Pousser vers GitHub
    - git push --mirror github

# Déploiement en staging
deploy-staging:
  stage: deploy-staging
  image: "alpine:latest"
  only:
    - master
  needs:
    - sync-to-github
  variables:
    STAGING_SERVER: $STAGING_SERVER
    STAGING_SSH_USER: $STAGING_SSH_USER
  before_script:
    # Installation de SSH et configuration de la clé privée
    - apk add --no-cache openssh-client bash git
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "$STAGING_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_staging
      chmod 600 ~/.ssh/id_rsa_staging
      ssh-add ~/.ssh/id_rsa_staging
      ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Déploiement sur l'environnement de staging..."
    - |
      ssh $STAGING_SSH_USER@$STAGING_SERVER "cd /path/to/staging/app && \
      git pull origin master && \
      docker-compose -f docker-compose.yml down && \
      docker-compose -f docker-compose.yml up -d web_staging nginx && \
      docker-compose exec -T web_staging python manage.py migrate --settings=config.staging_settings && \
      docker-compose exec -T web_staging python manage.py collectstatic --noinput --settings=config.staging_settings"
  environment:
    name: staging
    url: https://staging.recovr.com
  when: manual

# Déploiement en production
deploy-production:
  stage: deploy-production
  image: "alpine:latest"
  only:
    - master
  needs:
    - deploy-staging
  variables:
    PRODUCTION_SERVER: $PRODUCTION_SERVER
    PRODUCTION_SSH_USER: $PRODUCTION_SSH_USER
  before_script:
    # Installation de SSH et configuration de la clé privée
    - apk add --no-cache openssh-client bash git
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "$PRODUCTION_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_production
      chmod 600 ~/.ssh/id_rsa_production
      ssh-add ~/.ssh/id_rsa_production
      ssh-keyscan -H $PRODUCTION_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Déploiement sur l'environnement de production..."
    - |
      ssh $PRODUCTION_SSH_USER@$PRODUCTION_SERVER "cd /path/to/production/app && \
      git pull origin master && \
      docker-compose -f docker-compose.yml down && \
      docker-compose -f docker-compose.yml up -d web nginx && \
      docker-compose exec -T web python manage.py migrate && \
      docker-compose exec -T web python manage.py collectstatic --noinput"
  environment:
    name: production
    url: https://recovr.com
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual