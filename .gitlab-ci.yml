stages:
  - lint
  - test
  - changelog
  - sync
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Cache global pour Poetry
.poetry_cache: &poetry_cache
  cache:
    key: poetry-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pypoetry
      - .venv/

# Template pour les jobs Python
.python_job: &python_job
  image: "python:3.12-slim"
  <<: *poetry_cache
  before_script:
    - pip install --upgrade pip poetry
    - poetry config virtualenvs.in-project true
    - poetry install

# Lint stage
lint:
  <<: *python_job
  stage: lint
  script:
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .
  allow_failure: false

# Test stage
test:
  <<: *python_job
  stage: test
  script:
    - poetry install
    - poetry run pytest

# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12-slim"
  only:
    - master
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      
      echo "Configuring SSH key for changelog..."
      echo "$CHANGELOG_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    - git clone --depth=50 git@gitlab.com:${CI_PROJECT_PATH}.git /tmp/repo
    - cd /tmp/repo
    - git remote set-url origin git@gitlab.com:${CI_PROJECT_PATH}.git
    - git fetch --tags
  script:
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi
    - |
      if grep -q "\[tool.semantic_release.remote\]" pyproject.toml; then
        sed -i "/\[tool.semantic_release.remote\]/,/^\[/ s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml
      fi
    - echo "Last commit message:" && git log -1 --pretty=%B
    - echo "Recent commits:" && git log --oneline -n 5
    - semantic-release version --no-push -vv || echo "No version bump needed"
    - |
      if git status --porcelain | grep -q "CHANGELOG.md\|config/__init__.py"; then
        git add CHANGELOG.md config/__init__.py
        git commit -m "docs: update changelog [skip ci]"
        git push origin HEAD:master
        echo "Changelog updated and pushed"
      else
        echo "No changelog changes detected"
      fi


# Synchro Github
sync-to-github:
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Utiliser la clé SSH spécifique pour GitHub
      echo "$GITHUB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_github
      chmod 600 ~/.ssh/id_rsa_github
      ssh-add ~/.ssh/id_rsa_github
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    # Configurer git pour travailler avec GitHub
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
  script:
    # Cloner le dépôt GitLab actuel
    - git clone --mirror $CI_REPOSITORY_URL gitlab_repo
    - cd gitlab_repo
    # Configurer le dépôt GitHub distant
    - git remote add github git@github.com:stan-kempachi/recovr_software.git
    # Pousser vers GitHub
    - git push --mirror github

# Template pour les déploiements
.deploy_template: &deploy_template
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - apt-get update && apt-get install -y openssh-client bash rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" > ~/.ssh/config
    - ssh $DO_USER@$DO_IP "echo 'SSH connection test successful'"

# Déploiement staging
deploy-staging:
  stage: deploy-staging
  before_script:
    - apt-get update && apt-get install -y openssh-client rsync
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $DO_IP >> ~/.ssh/known_hosts
  script:
    # Préparer le dossier distant
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/staging"
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/logs/nginx"

    # Copier les docker-compose
    - scp docker_compose.staging.yml $DO_USER@$DO_IP:/home/django/recovr_software/staging/
    - scp docker_compose.proxy.yml $DO_USER@$DO_IP:/home/django/recovr_software/

    # Générer le .env localement
    - |
      echo "# Staging environment" > .env.staging
      echo "DEBUG=False" >> .env.staging
      echo "SECRET_KEY=$STAGING_SECRET_KEY" >> .env.staging
      echo "ALLOWED_HOSTS=$DO_IP,recovr-staging.example.com" >> .env.staging
      echo "DB_ENGINE=django.db.backends.postgresql" >> .env.staging
      echo "DB_NAME=$STAGING_DB_NAME" >> .env.staging
      echo "DB_USER=$STAGING_DB_USER" >> .env.staging
      echo "DB_PASSWORD=$STAGING_DB_PASSWORD" >> .env.staging
      echo "DB_HOST=$STAGING_DB_HOST" >> .env.staging
      echo "DB_PORT=$STAGING_DB_PORT" >> .env.staging
      echo "ENVIRONMENT=staging" >> .env.staging

    # Envoyer le .env sur le serveur
    - scp .env.staging $DO_USER@$DO_IP:/home/django/recovr_software/staging/.env

    # Déployer avec docker compose
    - ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software/staging &&
      docker-compose --env-file .env.staging -f docker_compose.staging.yml build web_staging &&
      docker-compose --env-file .env.staging -f docker_compose.staging.yml run --rm web_staging python manage.py migrate &&
      docker-compose --env-file .env.staging -f docker_compose.staging.yml run --rm web_staging python manage.py collectstatic --noinput &&
      docker-compose --env-file .env.staging -f docker_compose.staging.yml up -d web_staging nginx"
  only:
    - master


# Déploiement production
deploy-production:
  stage: deploy-production
  before_script:
    - apt-get update && apt-get install -y openssh-client rsync
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H $DO_IP >> ~/.ssh/known_hosts
  script:
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/production"
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/logs/nginx"
    - scp docker_compose.production.yml $DO_USER@$DO_PROD_IP:/home/django/recovr_software/production/
    - scp docker_compose.proxy.yml $DO_USER@$DO_PROD_IP:/home/django/recovr_software/
   # Préparer le .env pour production
    - |
      echo "# Production environment" > .env.production
      echo "DEBUG=False" >> .env.production
      echo "PRODUCTION_SECRET_KEY=$PRODUCTION_SECRET_KEY" >> .env.production
      echo "ALLOWED_HOSTS=$DO_IP,recovr.com,www.recovr.com" >> .env.production
      echo "DB_ENGINE=django.db.backends.postgresql" >> .env.production
      echo "PRODUCTION_DB_NAME=$PRODUCTION_DB_NAME" >> .env.production
      echo "PRODUCTION_DB_USER=$PRODUCTION_DB_USER" >> .env.production
      echo "PRODUCTION_DB_PASSWORD=$PRODUCTION_DB_PASSWORD" >> .env.production
      echo "PRODUCTION_DB_HOST=$PRODUCTION_DB_HOST" >> .env.production
      echo "PRODUCTION_DB_PORT=${PRODUCTION_DB_PORT:-5432}" >> .env.production
      echo "ENVIRONMENT=production" >> .env.production

    # Envoyer le .env sur le serveur
    - scp .env.production $DO_USER@$DO_IP:/home/django/recovr_software/production/.env

    # Déployer avec docker compose
    - ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software/production &&
      docker-compose --env-file .env.production -f docker_compose.production.yml build web_production &&
      docker-compose --env-file .env.production -f docker_compose.production.yml run --rm web_production python manage.py migrate &&
      docker-compose --env-file .env.production -f docker_compose.production.yml run --rm web_production python manage.py collectstatic --noinput &&
      docker-compose --env-file .env.production -f docker_compose.production.yml up -d web_production nginx"
    # Nettoyage des images Docker inutilisées pour libérer de l'espace
    - ssh $DO_USER@$DO_IP "docker image prune -f"
  only:
    - master

# Job optionnel pour déployer le proxy nginx (à lancer après staging et production)
deploy-proxy:
  <<: *deploy_template
  stage: deploy-production
  before_script:
    - apt-get update && apt-get install -y openssh-client rsync
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H $DO_IP >> ~/.ssh/known_hosts
  script:
    # S'assurer que les fichiers nginx sont présents
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/nginx"
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/logs/nginx"
    # Démarrer nginx
    - |
      ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software &&
      
      # Vérifier que les services web sont en cours d'exécution
      docker ps | grep recovr_web || echo 'Warning: Web services may not be running' &&
      
      # Démarrer le proxy nginx
      docker-compose -f docker_compose.proxy.yml up -d nginx &&
      
      echo 'Proxy deployment completed'
      "
  only:
    - master
  when: manual
  needs:
    - deploy-production
  environment:
    name: proxy
