stages:
  - lint
  - test
  - changelog
  - sync
  - deploy-staging
  - deploy-production
  - deploy-proxy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

# Cache global pour Poetry
.poetry_cache: &poetry_cache
  cache:
    key: poetry-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pypoetry
      - .venv/

# Template pour les jobs Python avec runner auto-hébergé
.python_job: &python_job
  image: "python:3.12-slim"
  <<: *poetry_cache
  tags:
    - self-hosted
  before_script:
    - pip install --upgrade pip poetry
    - poetry config virtualenvs.in-project true
    - poetry install

# Lint stage
lint:
  <<: *python_job
  stage: lint
  script:
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .
  allow_failure: false

test:
  <<: *python_job
  stage: test
  variables:
    DJANGO_SETTINGS_MODULE: config.settings
    POSTGRES_DB: test_recovr          # base pour les tests
    POSTGRES_USER: $STAGING_DB_USER
    POSTGRES_PASSWORD: $STAGING_DB_PASSWORD
    POSTGRES_HOST: $STAGING_DB_HOST  # ex: 127.0.0.1 ou IP du serveur
    POSTGRES_PORT: $STAGING_DB_PORT  # normalement 5432
  script:
    # recréer la base test pour s'assurer qu'elle est vide
    - psql -h $POSTGRES_HOST -U $POSTGRES_USER -c "DROP DATABASE IF EXISTS test_recovr;"
    - psql -h $POSTGRES_HOST -U $POSTGRES_USER -c "CREATE DATABASE test_recovr;"
    - poetry run pytest


# Update changelog stage
update-changelog:
  tags:
    - self-hosted
  stage: changelog
  image: "python:3.12-slim"
  only:
    - master
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      echo "Configuring SSH key for changelog..."
      echo "$CHANGELOG_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    - git clone --depth=50 git@gitlab.com:${CI_PROJECT_PATH}.git /tmp/repo
    - cd /tmp/repo
    - git remote set-url origin git@gitlab.com:${CI_PROJECT_PATH}.git
    - git fetch --tags
  script:
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi
    - |
      if grep -q "\[tool.semantic_release.remote\]" pyproject.toml; then
        sed -i "/\[tool.semantic_release.remote\]/,/^\[/ s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml
      fi
    - echo "Last commit message:" && git log -1 --pretty=%B
    - echo "Recent commits:" && git log --oneline -n 5
    - semantic-release version -vv || echo "No version bump needed"
    - |
      if git status --porcelain | grep -q "CHANGELOG.md\|config/__init__.py"; then
        git add CHANGELOG.md config/__init__.py
        git commit -m "docs: update changelog [skip ci]"
        git push origin HEAD:master
        echo "Changelog updated and pushed"
      else
        echo "No changelog changes detected"
      fi


      

# Synchro Github
sync-to-github:
  tags:
    - self-hosted
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Utiliser la clé SSH spécifique pour GitHub
      echo "$GITHUB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_github
      chmod 600 ~/.ssh/id_rsa_github
      ssh-add ~/.ssh/id_rsa_github
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    # Configurer git pour travailler avec GitHub
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
  script:
    # Cloner le dépôt GitLab actuel
    - git clone --mirror $CI_REPOSITORY_URL gitlab_repo
    - cd gitlab_repo
    # Configurer le dépôt GitHub distant
    - git remote add github git@github.com:stan-kempachi/recovr_software.git
    # Pousser vers GitHub
    - git push --mirror github

# Template de job de déploiement
.deploy_job: &deploy_job
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  tags:
    - self-hosted
  before_script:
    - apt-get update && apt-get install -y openssh-client rsync bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $DO_IP >> ~/.ssh/known_hosts

# ---------------------------
# Déploiement Staging
# ---------------------------
deploy-staging:
  <<: *deploy_job
  stage: deploy-staging
  script:
    # Créer les répertoires nécessaires sur le serveur
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/staging /home/django/recovr_software/logs/nginx"

    # Copier les fichiers essentiels
    - scp docker_compose.staging.yml pyproject.toml poetry.lock Dockerfile $DO_USER@$DO_IP:/home/django/recovr_software/staging/

    # Génération du .env staging localement et suppression des retours chariot
    - |
      echo "DEBUG=False" > .env.staging
      echo "STAGING_SECRET_KEY=$STAGING_SECRET_KEY" >> .env.staging
      echo "DJANGO_SETTINGS_MODULE=config.staging_settings" >> .env.staging
      echo "ALLOWED_HOSTS=$ALLOWED_HOSTS" >> .env.staging
      echo "DB_ENGINE=django.db.backends.postgresql" >> .env.staging
      echo "STAGING_DB_NAME=$STAGING_DB_NAME" >> .env.staging
      echo "STAGING_DB_USER=$STAGING_DB_USER" >> .env.staging
      echo "STAGING_DB_PASSWORD=$STAGING_DB_PASSWORD" >> .env.staging
      echo "STAGING_DB_HOST=$STAGING_DB_HOST" >> .env.staging
      echo "STAGING_DB_PORT=$STAGING_DB_PORT" >> .env.staging
      echo "ENVIRONMENT=staging" >> .env.staging
      echo "GOOGLE_OAUTH2_CLIENT_ID=$GOOGLE_OAUTH2_CLIENT_ID" >> .env.staging
      echo "GOOGLE_OAUTH2_CLIENT_SECRET=$GOOGLE_OAUTH2_CLIENT_SECRET" >> .env.staging
    - cat .env.staging | tr -d '\r' | ssh $DO_USER@$DO_IP "cat > /home/django/recovr_software/staging/.env.staging"

    # Pull du dépôt GitLab et nettoyage (ne supprime pas .env.staging)
    - ssh $DO_USER@$DO_IP "
        cd /home/django/recovr_software/staging &&
        git fetch origin &&
        git reset --hard origin/master
      "

    # Build et lancement des conteneurs
    - ssh $DO_USER@$DO_IP "
        cd /home/django/recovr_software/staging &&
        export DJANGO_SETTINGS_MODULE=config.staging_settings &&
        docker-compose --env-file .env.staging -f docker_compose.staging.yml build --no-cache web_staging &&
        docker-compose --env-file .env.staging -f docker_compose.staging.yml run --rm web_staging python manage.py migrate --settings=config.staging_settings &&
        docker-compose --env-file .env.staging -f docker_compose.staging.yml run --rm web_staging python manage.py collectstatic --noinput --settings=config.staging_settings &&
        docker-compose --env-file .env.staging -f docker_compose.staging.yml up -d web_staging
      "
  only:
    - master

# ---------------------------
# Déploiement Production
# ---------------------------
deploy-production:
  <<: *deploy_job
  stage: deploy-production
  script:
    # Créer les répertoires nécessaires sur le serveur
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/production /home/django/recovr_software/logs/nginx"

    # Copier les fichiers essentiels
    - scp docker_compose.production.yml pyproject.toml poetry.lock Dockerfile $DO_USER@$DO_IP:/home/django/recovr_software/production/

    # Génération du .env production localement et suppression des retours chariot
    - |
      echo "DEBUG=False" > .env.production
      echo "PRODUCTION_SECRET_KEY=$PRODUCTION_SECRET_KEY" >> .env.production
      echo "DJANGO_SETTINGS_MODULE=config.production_settings" >> .env.staging      
      echo "ALLOWED_HOSTS=$ALLOWED_HOSTS" >> .env.production
      echo "DB_ENGINE=django.db.backends.postgresql" >> .env.production
      echo "PRODUCTION_DB_NAME=$PRODUCTION_DB_NAME" >> .env.production
      echo "PRODUCTION_DB_USER=$PRODUCTION_DB_USER" >> .env.production
      echo "PRODUCTION_DB_PASSWORD=$PRODUCTION_DB_PASSWORD" >> .env.production
      echo "PRODUCTION_DB_HOST=$PRODUCTION_DB_HOST" >> .env.production
      echo "PRODUCTION_DB_PORT=$PRODUCTION_DB_PORT" >> .env.production
      echo "ENVIRONMENT=production" >> .env.production
      echo "GOOGLE_OAUTH2_CLIENT_ID=$GOOGLE_OAUTH2_CLIENT_ID" >> .env.production
      echo "GOOGLE_OAUTH2_CLIENT_SECRET=$GOOGLE_OAUTH2_CLIENT_SECRET" >> .env.production
    - cat .env.production | tr -d '\r' | ssh $DO_USER@$DO_IP "cat > /home/django/recovr_software/production/.env.production"

    # Pull du dépôt GitLab et nettoyage (ne supprime pas .env.production)
    - ssh $DO_USER@$DO_IP "
        cd /home/django/recovr_software/production &&
        git fetch origin &&
        git reset --hard origin/master
      "

    # Build et lancement des conteneurs production
    - ssh $DO_USER@$DO_IP "
        cd /home/django/recovr_software/production &&
        export DJANGO_SETTINGS_MODULE=config.production_settings &&
        docker-compose --env-file .env.production -f docker_compose.production.yml build --no-cache web_production &&
        docker-compose --env-file .env.production -f docker_compose.production.yml run --rm web_production python manage.py migrate --settings=config.production_settings &&
        docker-compose --env-file .env.production -f docker_compose.production.yml run --rm web_production python manage.py collectstatic --noinput --settings=config.production_settings &&
        docker-compose --env-file .env.production -f docker_compose.production.yml up -d web_production
      "
  only:
    - master
  when: manual

# ---------------------------
# Déploiement Proxy Nginx
# ---------------------------
deploy-proxy:
  <<: *deploy_job
  stage: deploy-proxy
  script:
    - |
      ssh $DO_USER@$DO_IP '
        mkdir -p /home/django/recovr_software/nginx /home/django/recovr_software/logs/nginx
      '
    - scp docker_compose.proxy.yml $DO_USER@$DO_IP:/home/django/recovr_software/
    - |
      ssh $DO_USER@$DO_IP '
        cd /home/django/recovr_software
        if ! docker ps | grep recovr_web; then
          echo "Warning: Web services may not be running"
        fi
        docker-compose -f docker_compose.proxy.yml up -d nginx
        echo "Proxy deployment completed"
      '
  only:
    - master
  when: manual
  environment:
    name: proxy
