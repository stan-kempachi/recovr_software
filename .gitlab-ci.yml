stages:
  - lint
  - test
  - changelog
  - sync
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Cache global pour Poetry
.poetry_cache: &poetry_cache
  cache:
    key: poetry-cache-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pypoetry
      - .venv/

# Template pour les jobs Python
.python_job: &python_job
  image: "python:3.12-slim"
  <<: *poetry_cache
  before_script:
    - pip install --upgrade pip poetry
    - poetry config virtualenvs.in-project true
    - poetry install

# Lint stage
lint:
  <<: *python_job
  stage: lint
  script:
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .
  allow_failure: false

# Test stage
test:
  <<: *python_job
  stage: test
  script:
    - poetry install
    - poetry run pytest


# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12-slim"
  only:
    - master
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      
      echo "Configuring SSH key for changelog..."
      echo "$CHANGELOG_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    - git clone --depth=50 git@gitlab.com:${CI_PROJECT_PATH}.git /tmp/repo
    - cd /tmp/repo
    - git remote set-url origin git@gitlab.com:${CI_PROJECT_PATH}.git
    - git fetch --tags
  script:
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi
    - |
      if grep -q "\[tool.semantic_release.remote\]" pyproject.toml; then
        sed -i "/\[tool.semantic_release.remote\]/,/^\[/ s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml
      fi
    - echo "Last commit message:" && git log -1 --pretty=%B
    - echo "Recent commits:" && git log --oneline -n 5
    - semantic-release version --no-push -vv || echo "No version bump needed"
    - |
      if git status --porcelain | grep -q "CHANGELOG.md\|config/__init__.py"; then
        git add CHANGELOG.md config/__init__.py
        git commit -m "docs: update changelog [skip ci]"
        git push origin HEAD:master
        echo "Changelog updated and pushed"
      else
        echo "No changelog changes detected"
      fi

sync-to-github:
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Utiliser la clé SSH spécifique pour GitHub
      echo "$GITHUB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_github
      chmod 600 ~/.ssh/id_rsa_github
      ssh-add ~/.ssh/id_rsa_github
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    # Configurer git pour travailler avec GitHub
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
  script:
    # Cloner le dépôt GitLab actuel
    - git clone --mirror $CI_REPOSITORY_URL gitlab_repo
    - cd gitlab_repo
    # Configurer le dépôt GitHub distant
    - git remote add github git@github.com:stan-kempachi/recovr_software.git
    # Pousser vers GitHub
    - git push --mirror github

# Template pour les déploiements
.deploy_template: &deploy_template
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - apk add --no-cache openssh-client bash rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" > ~/.ssh/config
    - ssh $DO_USER@$DO_IP "echo 'SSH connection test successful'"

# Déploiement staging
deploy-staging:
  <<: *deploy_template
  stage: deploy-staging
  script:
    # Créer les répertoires nécessaires
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/staging"
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/logs/nginx"

    # Copier les fichiers Docker Compose
    - scp docker_compose.staging.yml $DO_USER@$DO_IP:/home/django/recovr_software/staging/
    - scp docker_compose.proxy.yml $DO_USER@$DO_IP:/home/django/recovr_software/

    # Créer le fichier .env.staging
    - |
      cat > .env.staging << EOF
      # Staging environment
      ENVIRONMENT=staging
      DEBUG=True
      STAGING_SECRET_KEY=$STAGING_SECRET_KEY
      ALLOWED_HOSTS=$DO_IP,staging.recovr.com
      DB_ENGINE=django.db.backends.postgresql
      STAGING_DB_NAME=$STAGING_DB_NAME
      STAGING_DB_USER=$STAGING_DB_USER
      STAGING_DB_PASSWORD=$STAGING_DB_PASSWORD
      STAGING_DB_HOST=$STAGING_DB_HOST
      STAGING_DB_PORT=$STAGING_DB_PORT
      EOF
    - scp .env.staging $DO_USER@$DO_IP:/home/django/recovr_software/staging/

    # Nettoyer les dossiers problématiques et ajuster permissions
    - |
      ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software/staging &&
      # Supprimer les dossiers qui peuvent causer des conflits
      sudo rm -rf certbot/ venv/ .venv/ node_modules/ 2>/dev/null || true &&
      # Ajuster les permissions du répertoire
      sudo chown -R $DO_USER:$DO_USER . 2>/dev/null || true &&
      sudo chmod -R u+w . 2>/dev/null || true

    # Copier le code source
    - rsync -avz --delete --exclude='.git' --exclude='*.pyc' --exclude='__pycache__' ./ $DO_USER@$DO_IP:/home/django/recovr_software/staging/

    # Déployer les services
    - |
      ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software &&
      
      # Créer le réseau externe s'il n'existe pas
      docker network create recovr_network 2>/dev/null || echo 'Network already exists' &&
      
      # Créer les volumes externes s'ils n'existent pas
      docker volume create static_staging 2>/dev/null || echo 'Volume static_staging already exists' &&
      docker volume create media_staging 2>/dev/null || echo 'Volume media_staging already exists' &&
      docker volume create static_production 2>/dev/null || echo 'Volume static_production already exists' &&
      docker volume create media_production 2>/dev/null || echo 'Volume media_production already exists' &&
      
      # Build et démarrer staging
      cd staging &&
      docker-compose -f docker_compose.staging.yml --env-file .env.staging build web_staging &&
      docker-compose -f docker_compose.staging.yml --env-file .env.staging up -d web_staging &&
      
      # Attendre que le service soit prêt
      echo 'Waiting for staging service to be ready...' &&
      sleep 30 &&
      
      # Nettoyage des images inutilisées
      docker image prune -f
      "
  only:
    - master
  environment:
    name: staging
    url: http://$DO_IP:8001

# Déploiement production
deploy-production:
  <<: *deploy_template
  stage: deploy-production
  script:
    # Créer les répertoires nécessaires
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/production"
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/logs/nginx"

    # Copier les fichiers Docker Compose
    - scp docker_compose.production.yml $DO_USER@$DO_IP:/home/django/recovr_software/production/
    - scp docker_compose.proxy.yml $DO_USER@$DO_IP:/home/django/recovr_software/

    # Créer le fichier .env.production
    - |
      cat > .env.production << EOF
      # Production environment
      ENVIRONMENT=production
      DEBUG=False
      PRODUCTION_SECRET_KEY=$PRODUCTION_SECRET_KEY
      ALLOWED_HOSTS=$DO_IP,recovr.com,www.recovr.com
      DB_ENGINE=django.db.backends.postgresql
      PRODUCTION_DB_NAME=$PRODUCTION_DB_NAME
      PRODUCTION_DB_USER=$PRODUCTION_DB_USER
      PRODUCTION_DB_PASSWORD=$PRODUCTION_DB_PASSWORD
      PRODUCTION_DB_HOST=$PRODUCTION_DB_HOST
      PRODUCTION_DB_PORT=${PRODUCTION_DB_PORT:-5432}
      EOF
    - scp .env.production $DO_USER@$DO_IP:/home/django/recovr_software/production/

    # Nettoyer les dossiers problématiques et ajuster permissions
    - |
      ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software/production &&
      # Supprimer les dossiers qui peuvent causer des conflits
      sudo rm -rf certbot/ venv/ .venv/ node_modules/ 2>/dev/null || true &&
      # Ajuster les permissions du répertoire
      sudo chown -R $DO_USER:$DO_USER . 2>/dev/null || true &&
      sudo chmod -R u+w . 2>/dev/null || true

    # Copier le code source
    - rsync -avz --delete --exclude='.git' --exclude='*.pyc' --exclude='__pycache__' ./ $DO_USER@$DO_IP:/home/django/recovr_software/production/

    # Déployer les services
    - |
      ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software &&
      
      # Créer le réseau externe s'il n'existe pas
      docker network create recovr_network 2>/dev/null || echo 'Network already exists' &&
      
      # Créer les volumes externes s'ils n'existent pas (au cas où)
      docker volume create static_production 2>/dev/null || echo 'Volume static_production already exists' &&
      docker volume create media_production 2>/dev/null || echo 'Volume media_production already exists' &&
      docker volume create static_staging 2>/dev/null || echo 'Volume static_staging already exists' &&
      docker volume create media_staging 2>/dev/null || echo 'Volume media_staging already exists' &&
      
      # Build et démarrer production
      cd production &&
      docker-compose -f docker_compose.production.yml --env-file .env.production build web_production &&
      docker-compose -f docker_compose.production.yml --env-file .env.production up -d web_production &&
      
      # Attendre que le service soit prêt
      echo 'Waiting for production service to be ready...' &&
      sleep 30 &&
      
      # Nettoyage des images inutilisées
      docker image prune -f
      "
  only:
    - master
  when: manual
  needs:
    - deploy-staging
  environment:
    name: production
    url: http://$DO_IP

# Job optionnel pour déployer le proxy nginx (à lancer après staging et production)
deploy-proxy:
  <<: *deploy_template
  stage: deploy-production
  script:
    # S'assurer que les fichiers nginx sont présents
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/nginx"
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/logs/nginx"

    # Démarrer nginx
    - |
      ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software &&
      
      # Vérifier que les services web sont en cours d'exécution
      docker ps | grep recovr_web || echo 'Warning: Web services may not be running' &&
      
      # Démarrer le proxy nginx
      docker-compose -f docker_compose.proxy.yml up -d nginx &&
      
      echo 'Proxy deployment completed'
      "
  only:
    - master
  when: manual
  needs:
    - deploy-production
  environment:
    name: proxy
