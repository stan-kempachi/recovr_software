stages:
  - lint
  - test
  - changelog
  - sync
  - deploy-staging
  - deploy-production


# Lint stage
lint:
  stage: lint
  image: "python:3.12"
  cache:
    key: poetry-cache
    paths:
      - .cache/pypoetry
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .
  when: manual



# Test stage
test:
  stage: test
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run pytest
  when: manual


# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12"
  only:
    - master
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    # Configuration SSH
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-add ~/.ssh/id_rsa
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    # Configurer git pour travailler avec la branche
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    # Au lieu de faire un checkout, cloner le repo avec l'historique complet
    - git clone --depth=50 git@gitlab.com:${CI_PROJECT_PATH}.git /tmp/repo
    - cd /tmp/repo
    # Configurer l'URL du dépôt en utilisant SSH au lieu de HTTPS
    - git remote set-url origin git@gitlab.com:django1361117/recovr_software.git
  script:
    # Vérifier si config/__init__.py existe, sinon le créer
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi

    # Mettre à jour le token dans pyproject.toml
    - |
      if grep -q "\[tool.semantic_release.remote\]" pyproject.toml; then
        sed -i "/\[tool.semantic_release.remote\]/,/^\[/ s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml || true
        # Si le token est la dernière ligne du fichier
        sed -i "s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml || true
      fi

    # Afficher le dernier commit pour le débogage
    - echo "Dernier message de commit:"
    - git log -1 --pretty=%B

    # Utiliser semantic-release directement sans détection supplémentaire
    - semantic-release version --no-push

    # Vérifier si des fichiers ont été modifiés
    - |
      if git status --porcelain | grep -q "CHANGELOG.md\|config/__init__.py"; then
        git add CHANGELOG.md config/__init__.py
        git commit -m "docs: mise à jour du changelog [skip ci]"
        git push origin HEAD:master
        echo "Changelog mis à jour et poussé vers le dépôt"
      else
        echo "Aucun changement détecté dans CHANGELOG.md ou config/__init__.py"
      fi
  when: manual


sync-to-github:
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Utiliser la clé SSH spécifique pour GitHub
      echo "$GITHUB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_github
      chmod 600 ~/.ssh/id_rsa_github
      ssh-add ~/.ssh/id_rsa_github
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    # Configurer git pour travailler avec GitHub
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
  script:
    # Cloner le dépôt GitLab actuel
    - git clone --mirror $CI_REPOSITORY_URL gitlab_repo
    - cd gitlab_repo
    # Configurer le dépôt GitHub distant
    - git remote add github git@github.com:stan-kempachi/recovr_software.git
    # Pousser vers GitHub
    - git push --mirror github
  when: manual


# Déploiement en staging
deploy-staging:
  stage: deploy-staging
  image: "docker:20.10.16"
  services:
    - docker:20.10.16-dind
  variables:
    DO_IP: $DO_IP
    DO_USER: $DO_USER
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  before_script:
    - apk add --no-cache openssh-client bash rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" > ~/.ssh/config
    - ssh -vT $DO_USER@$DO_IP "echo 'Test de connexion SSH réussi'"

  script:
    # Création du fichier .env pour l'environnement de staging
    - echo "# Parametres generaux pour staging" > .env.staging
    - echo "DEBUG=False" >> .env.staging
    - echo "STAGING_SECRET_KEY=$STAGING_SECRET_KEY" >> .env.staging
    - echo "ALLOWED_HOSTS=$DO_IP,recovr-staging.example.com" >> .env.staging
    - echo "" >> .env.staging
    - echo "# Database - Staging" >> .env.staging
    - echo "DB_ENGINE=django.db.backends.postgresql" >> .env.staging
    - echo "STAGING_DB_NAME=$STAGING_DB_NAME" >> .env.staging
    - echo "STAGING_DB_USER=$STAGING_DB_USER" >> .env.staging
    - echo "STAGING_DB_PASSWORD=$STAGING_DB_PASSWORD" >> .env.staging
    - echo "STAGING_DB_HOST=$STAGING_DB_HOST" >> .env.staging
    - echo "DB_PORT=$STAGING_DB_PORT" >> .env.staging
    - echo "ENVIRONMENT=staging" >> .env.staging

    # Transférer le .env.staging vers le serveur
    - scp .env.staging $DO_USER@$DO_IP:/home/django/recovr_software/staging/.env

    # Préparation du répertoire sur le serveur
    - ssh -v $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/staging/{nginx,certbot/conf,certbot/www}"

    # Transférer les fichiers nécessaires
    - rsync -avz --delete -e "ssh -v" ./* $DO_USER@$DO_IP:/home/django/recovr_software/staging/
    - scp docker_compose.yml $DO_USER@$DO_IP:/home/django/recovr_software/staging/
    - scp Dockerfile $DO_USER@$DO_IP:/home/django/recovr_software/staging/

    # Transférer la configuration Nginx
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/staging/nginx"
    - scp nginx/default.conf $DO_USER@$DO_IP:/home/django/recovr_software/staging/nginx/

    # Déploiement avec Docker Compose en utilisant le .env déjà copié
    - |
      ssh -v $DO_USER@$DO_IP "cd /home/django/recovr_software/staging && \
      docker-compose -f docker_compose.yml build web_staging && \
      docker-compose -f docker_compose.yml up -d db && \
      sleep 10 && \
      docker-compose -f docker_compose.yml run --rm web_staging env | grep DB_ && \
      docker-compose -f docker_compose.yml run --rm web_staging python manage.py migrate && \
      docker-compose -f docker_compose.yml run --rm web_staging python manage.py collectstatic --noinput && \
      docker-compose -f docker_compose.yml up -d web_staging nginx"

    # Vérification de l'état des conteneurs
    - ssh $DO_USER@$DO_IP "cd /home/django/recovr_software/staging && docker-compose -f docker_compose.yml ps"

    - echo "Déploiement de l'environnement staging terminé avec succès!"
  only:
    - master
  when: manual

# Déploiement en production
deploy-production:
  stage: deploy-production
  image: "alpine:latest"
  needs:
    - deploy-staging  # Pour s'assurer que le staging fonctionne avant de déployer en production
  variables:
    DO_IP: $DO_IP
    DO_USER: $DO_USER
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
  before_script:
    # Installation de SSH et configuration de la clé privée
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DO_IP >> ~/.ssh/known_hosts

    # Débogage des variables
    - echo "DO_IP = ${DO_IP}"
    - echo "DO_USER = ${DO_USER}"

    # Test de connexion SSH
    - ssh -o StrictHostKeyChecking=no $DO_USER@$DO_IP "echo 'SSH connection test successful'"
  script:
    # Création du fichier .env pour l'environnement de production
    - echo "# Parametres generaux pour production" > .env.production
    - echo "DEBUG=False" >> .env.production
    - echo "SECRET_KEY=$PRODUCTION_SECRET_KEY" >> .env.production
    - echo "ALLOWED_HOSTS=$DO_IP,recovr.example.com" >> .env.production
    - echo "" >> .env.production
    - echo "# Database - Production" >> .env.production
    - echo "DB_ENGINE=django.db.backends.postgresql" >> .env.production
    - echo "DB_NAME=$PRODUCTION_DB_NAME" >> .env.production
    - echo "DB_USER=$PRODUCTION_DB_USER" >> .env.production

    - echo "DB_PASSWORD=$PRODUCTION_DB_PASSWORD" >> .env.production
    - echo "DB_HOST=$PROD_DB_HOST" >> .env.production
    - echo "DB_PORT=$PROD_DB_PORT" >> .env.production

    # Cloner le dépôt sur le serveur production
    - ssh -v -o StrictHostKeyChecking=no $DO_USER@$DO_IP "mkdir -p /recovr_software/production"

    # Déployer le code et le fichier .env sur le serveur
    - scp -v -r ./* $DO_USER@$DO_IP:/recovr_software/production/
    - scp .env.production $DO_USER@$DO_IP:/recovr_software/production/.env

    # Exécuter les commandes de déploiement sur le serveur
    - |
      ssh -v -o StrictHostKeyChecking=no $DO_USER@$DO_IP "cd /recovr_software/production && \
      python3 -m venv venv || true && \
      source venv/bin/activate && \
      pip install --upgrade pip && \
      pip install poetry && \
      poetry config virtualenvs.create false && \
      poetry install && \
      python manage.py migrate && \
      python manage.py collectstatic --noinput && \
      sudo systemctl restart gunicorn-production"
  only:
    - master
  when: manual