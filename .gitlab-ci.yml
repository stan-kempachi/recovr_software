stages:
  - lint
  - test
  - changelog
  - sync
  - deploy-staging
  - deploy-production


# Lint stage
lint:
  stage: lint
  image: "python:3.12"
  cache:
    key: poetry-cache
    paths:
      - .cache/pypoetry
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run black --check .
    - poetry run ruff check .
    - poetry run isort --check-only .


# Test stage
test:
  stage: test
  image: "python:3.12"
  before_script:
    - pip install poetry
  script:
    - poetry install
    - poetry run pytest


# Update changelog stage
update-changelog:
  stage: changelog
  image: "python:3.12"
  only:
    - master
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  before_script:
    # Configuration SSH
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      
      # Debugging de la clé SSH
      echo "SSH key length: $(echo "$CHANGELOG_SSH_KEY" | wc -c) bytes"
      
      # Utiliser la clé SSH spécifique pour le job changelog avec format standard
      echo "$CHANGELOG_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_rsa_changelog
      chmod 600 ~/.ssh/id_rsa_changelog
      
      # Vérifier le format du fichier de clé
      ls -la ~/.ssh/id_rsa_changelog
      
      # Tenter d'ajouter la clé avec plus d'informations de débogage
      ssh-add -v ~/.ssh/id_rsa_changelog || echo "Failed to add SSH key"
      ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
    - pip install python-semantic-release
    # Configurer git pour travailler avec la branche
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
    # Cloner le repo avec l'historique complet (augmenter la profondeur)
    - git clone --depth=200 git@gitlab.com:${CI_PROJECT_PATH}.git /tmp/repo
    - cd /tmp/repo
    # Configurer l'URL du dépôt en utilisant SSH
    - git remote set-url origin git@gitlab.com:${CI_PROJECT_PATH}.git
    # Récupérer les tags, importants pour semantic-release
    - git fetch --tags
  script:
    # Vérifier si config/__init__.py existe, sinon le créer
    - |
      if [ ! -f "config/__init__.py" ]; then
        mkdir -p config
        echo "__version__ = \"0.1.0\"" > config/__init__.py
      fi

    # Mettre à jour le token dans pyproject.toml
    - |
      if grep -q "\[tool.semantic_release.remote\]" pyproject.toml; then
        sed -i "/\[tool.semantic_release.remote\]/,/^\[/ s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml || true
        # Si le token est la dernière ligne du fichier
        sed -i "s/token.*=.*/token = \"${GITLAB_TOKEN}\"/" pyproject.toml || true
      fi

    # Afficher le dernier commit et l'historique pour le débogage
    - echo "Dernier message de commit:"
    - git log -1 --pretty=%B
    - echo "Liste des derniers commits:"
    - git log --oneline -n 10

    # Utiliser semantic-release en mode verbose pour obtenir plus d'informations
    - semantic-release version --no-push -vv || (echo "Semantic-release a échoué, mais le pipeline continue"; exit 0)

    # Vérifier si des fichiers ont été modifiés
    - |
      if git status --porcelain | grep -q "CHANGELOG.md\|config/__init__.py"; then
        git add CHANGELOG.md config/__init__.py
        git commit -m "docs: mise à jour du changelog [skip ci]"
        git push origin HEAD:master
        echo "Changelog mis à jour et poussé vers le dépôt"
      else
        echo "Aucun changement détecté dans CHANGELOG.md ou config/__init__.py"
      fi
      

      

sync-to-github:
  stage: sync
  image: "python:3.12"
  only:
    - master
  needs:
    - update-changelog
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - eval $(ssh-agent -s)
    - |
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      # Utiliser la clé SSH spécifique pour GitHub
      echo "$GITHUB_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa_github
      chmod 600 ~/.ssh/id_rsa_github
      ssh-add ~/.ssh/id_rsa_github
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    # Configurer git pour travailler avec GitHub
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"
  script:
    # Cloner le dépôt GitLab actuel
    - git clone --mirror $CI_REPOSITORY_URL gitlab_repo
    - cd gitlab_repo
    # Configurer le dépôt GitHub distant
    - git remote add github git@github.com:stan-kempachi/recovr_software.git
    # Pousser vers GitHub
    - git push --mirror github


# Déploiement en staging
deploy-staging:
  stage: deploy-staging
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DO_IP: $DO_IP
    DO_USER: $DO_USER
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
  before_script:
    - apk add --no-cache openssh-client bash rsync python3 py3-pip
    - pip install --ignore-installed packaging poetry
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" > ~/.ssh/config
    - ssh -vT $DO_USER@$DO_IP "echo 'Test de connexion SSH réussi'"
  script:
    # Préparer le .env pour staging
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/staging"
    # Créer un fichier .env vide
    - ssh $DO_USER@$DO_IP "touch /home/django/recovr_software/staging/.env"

    # Préparer le .env pour staging
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/staging"
    - |
      echo "# Staging environment" > .env.staging
      echo "DEBUG=False" >> .env.staging
      echo "SECRET_KEY=$STAGING_SECRET_KEY" >> .env.staging
      echo "ALLOWED_HOSTS=$DO_IP,recovr-staging.example.com" >> .env.staging
      echo "DB_ENGINE=django.db.backends.postgresql" >> .env.staging
      echo "DB_NAME=$STAGING_DB_NAME" >> .env.staging
      echo "DB_USER=$STAGING_DB_USER" >> .env.staging
      echo "DB_PASSWORD=$STAGING_DB_PASSWORD" >> .env.staging
      echo "DB_HOST=$STAGING_DB_HOST" >> .env.staging
      echo "DB_PORT=$STAGING_DB_PORT" >> .env.staging
      echo "ENVIRONMENT=staging" >> .env.staging
    - scp .env.staging $DO_USER@$DO_IP:/home/django/recovr_software/staging/.env.staging
    - ssh $DO_USER@$DO_IP "
      cd /home/django/recovr_software/staging &&
      docker-compose --env-file .env -f docker_compose.yml build web_staging &&
      docker-compose --env-file .env -f docker_compose.yml run --rm web_staging python manage.py migrate &&
      docker-compose --env-file .env -f docker_compose.yml run --rm web_staging python manage.py collectstatic --noinput &&
      docker-compose --env-file .env -f docker_compose.yml up -d web_staging nginx"
  only:
    - master


# Déploiement en production
deploy-production:
  stage: deploy-production
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DO_IP: $DO_IP
    DO_USER: $DO_USER
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
  before_script:
    - apk add --no-cache openssh-client bash rsync python3 py3-pip
    - pip install --ignore-installed packaging poetry
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" > ~/.ssh/config
    - ssh -vT $DO_USER@$DO_IP "echo 'Test de connexion SSH réussi'"
  script:
    # Préparer le .env pour production
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/production"
    # Créer un fichier .env vide
    - ssh $DO_USER@$DO_IP "touch /home/django/recovr_software/production/.env"
    - ssh $DO_USER@$DO_IP "mkdir -p /home/django/recovr_software/production"
    - |
      echo "# Production environment" > .env.production
      echo "DEBUG=False" >> .env.production
      echo "PRODUCTION_SECRET_KEY=$PRODUCTION_SECRET_KEY" >> .env.production
      echo "ALLOWED_HOSTS=$DO_IP,recovr.com,www.recovr.com" >> .env.production
      echo "DB_ENGINE=django.db.backends.postgresql" >> .env.production
      echo "PRODUCTION_DB_NAME=$PRODUCTION_DB_NAME" >> .env.production
      echo "PRODUCTION_DB_USER=$PRODUCTION_DB_USER" >> .env.production
      echo "PRODUCTION_DB_PASSWORD=$PRODUCTION_DB_PASSWORD" >> .env.production
      echo "PRODUCTION_DB_HOST=$PRODUCTION_DB_HOST" >> .env.production
      echo "PRODUCTION_DB_PORT=${PRODUCTION_DB_PORT:-5432}" >> .env.production
      echo "ENVIRONMENT=production" >> .env.production
    - scp .env.production $DO_USER@$DO_IP:/home/django/recovr_software/production/.env.production
    - ssh $DO_USER@$DO_IP "cd /home/django/recovr_software/production && docker-compose --env-file .env -f docker_compose.yml build web_production && docker-compose --env-file .env -f docker_compose.yml run --rm web_production python manage.py migrate && docker-compose --env-file .env -f docker_compose.yml run --rm web_production python manage.py collectstatic --noinput && docker-compose --env-file .env -f docker_compose.yml up -d web_production nginx"
    # Nettoyage des images Docker inutilisées pour libérer de l'espace
    - ssh $DO_USER@$DO_IP "docker image prune -f"
  only:
    - master
  when: manual
  needs:
   - deploy-staging
  environment:
    name: production
    url: https://recovr.com