version: '3.8'

services:
  # Django Staging
  web_staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=staging
    env_file:
      - .env.staging
    command: >
      bash -c "gunicorn config.wsgi:application --bind 0.0.0.0:8001"
    volumes:
      - static_staging:/app/staticfiles
      - media_staging:/app/media
    environment:
      ENVIRONMENT: staging
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: staging.recovr.com
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    networks:
      - recovr_network
    restart: always

  # Django Production
  web_production:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    env_file:
      - .env.production
    command: >
      bash -c "gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_production:/app/staticfiles
      - media_production:/app/media
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${PRODUCTION_SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: recovr.com,www.recovr.com
      DB_NAME: ${PRODUCTION_DB_NAME}
      DB_USER: ${PRODUCTION_DB_USER}
      DB_PASSWORD: ${PRODUCTION_DB_PASSWORD}
      DB_HOST: ${PRODUCTION_DB_HOST}
      DB_PORT: ${PRODUCTION_DB_PORT}
    networks:
      - recovr_network
    restart: always

  # Nginx - service unique pour les deux environnements
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_production:/var/www/production/static
      - static_staging:/var/www/staging/static
      - media_production:/var/www/production/media
      - media_staging:/var/www/staging/media
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web_production
      - web_staging
    networks:
      - recovr_network
    restart: always

  # Certbot
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

volumes:
  static_production:
  static_staging:
  media_production:
  media_staging:

networks:
  recovr_network: