version: '3.8'

services:
  web_production:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: recovr_web_production
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    env_file:
      - .env
    command: >
      bash -c "python manage.py migrate --noinput && 
               python manage.py collectstatic --noinput && 
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - static_production:/app/staticfiles
      - media_production:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: config.production_settings
    ports:
      - "8000:8000"  # Exposer le port pour debug si nécessaire
    networks:
      - recovr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL  http://localhost:8000/health/ || wget --quiet --tries=1 --spider http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  recovr_network:
    external: true

volumes:
  static_production:
    external: true
  media_production:
    external: true
