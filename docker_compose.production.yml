version: '3.8'

services:
  web_production:
    container_name: recovr_web_production
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    env_file:
      - .env.production
    command: >
      bash -c "python manage.py migrate --noinput && 
               python manage.py collectstatic --noinput && 
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - static_production:/app/staticfiles
      - media_production:/app/media
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${PRODUCTION_SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: ${PRODUCTION_DB_NAME}
      DB_USER: ${PRODUCTION_DB_USER}
      DB_PASSWORD: ${PRODUCTION_DB_PASSWORD}
      DB_HOST: ${PRODUCTION_DB_HOST}
      DB_PORT: ${PRODUCTION_DB_PORT:-5432}
    ports:
      - "8000:8000"  # Exposer le port pour debug si nécessaire
    networks:
      - recovr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL  http://localhost:8000/health/ || wget --quiet --tries=1 --spider http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  recovr_network:
    external: true

volumes:
  static_production:
    external: true
  media_production:
    external: true
